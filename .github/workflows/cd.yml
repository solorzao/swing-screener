name: CD

# Build the job image and repoint the Container Apps Jobs to it on every push to
# main, gated on the same lint/type/test suite as CI. Authentication to Azure is
# via OIDC federated credentials -- there is NO stored client secret. One-time
# setup (federated credential subject/issuer/audience + least-privilege role
# assignments + the repo secrets/vars below) is documented in docs/azure-deploy.md.
#
# Required repo secrets (identifiers, not credentials -- OIDC mints short-lived
# tokens at run time): AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
# Required repo variables (set after the first deploy): AZURE_RESOURCE_GROUP, ACR_NAME.

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write   # required for azure/login OIDC token exchange

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cockpit]"
      # Guard against a future migration branching the chain: alembic MUST have
      # exactly one head. alembic lives in the optional [azure] extra (not
      # installed above), so install it standalone -- `alembic heads` walks the
      # versions scripts only (no env.py, no DB), so the bare package suffices.
      # grep -c counts head LINES (one per head); a hex revision id can't contain
      # "head", so the match is unambiguous.
      #
      # Duplicated from ci.yml on purpose: THIS job is the only deploy gate, and
      # a two-headed chain that reached main would otherwise deploy and kill
      # every mssql job at startup upgrade ("Multiple head revisions").
      - name: Single alembic head
        run: |
          pip install "alembic>=1.13"
          test "$(python -m alembic heads 2>/dev/null | grep -c head)" -eq 1
      - name: Lint (ruff)
        run: ruff check src tests alembic
      - name: Type check (mypy)
        run: mypy
      - name: Tests (pytest)
        run: pytest -q

  deploy:
    needs: test          # CD is CI-gated: deploy never runs unless the suite is green
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      IMAGE: swing-screener
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build + push image (server-side via ACR)
        # `az acr build` builds inside ACR rather than on the runner. It is more
        # reliable for the msodbcsql18 layer (the packages.microsoft.com signing
        # key/URL rotates and breaks a runner-local docker build) and needs no
        # docker login. Tags the immutable git SHA (used by the jobs) and latest.
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE:${{ github.sha }}" \
            --image "$IMAGE:latest" \
            .

      - name: Repoint the Container Apps Jobs to the new image
        # `job update --image` does NOT start a run; the new image is used on the
        # next scheduled (or manual `job start`) execution. Rollback = re-run this
        # update with an older :<sha> tag. Runtime secrets stay in Key Vault.
        #
        # A job listed here may not exist yet (its bicep shipped, but the one-time
        # `az deployment sub create` provisioning hasn't run). SKIP it instead of
        # aborting -- otherwise one un-provisioned job (`bash -e`) leaves every job
        # after it on the old image. Once provisioned, the next run picks it up.
        run: |
          for job in evening-screen daily-digest on-demand-analysis intraday-exit weekly-digest monthly-digest market-weather journal-coach journal-audit-weekly journal-audit-breach; do
            if ! az containerapp job show --name "$job" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
              echo "Skipping $job -- not provisioned yet (run the bicep deploy to create it)"
              continue
            fi
            echo "Updating $job -> $IMAGE:${{ github.sha }}"
            az containerapp job update \
              --name "$job" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$ACR_NAME.azurecr.io/$IMAGE:${{ github.sha }}"
          done

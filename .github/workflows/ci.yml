name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cockpit]"

      # Guard against a future migration branching the chain: alembic MUST have
      # exactly one head. alembic lives in the optional [azure] extra (not
      # installed above), so install it standalone -- `alembic heads` walks the
      # versions scripts only (no env.py, no DB), so the bare package suffices.
      # grep -c counts head LINES (one per head); a hex revision id can't contain
      # "head", so the match is unambiguous.
      - name: Single alembic head
        run: |
          pip install "alembic>=1.13"
          test "$(python -m alembic heads 2>/dev/null | grep -c head)" -eq 1

      - name: Lint (ruff)
        run: ruff check src tests alembic

      - name: Type check (mypy)
        run: mypy

      - name: Tests (pytest)
        run: pytest -q

  cockpit-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cockpit-ui/package-lock.json

      - name: Install
        run: npm ci
        working-directory: cockpit-ui

      - name: Lint (oxlint)
        run: npm run lint
        working-directory: cockpit-ui

      - name: Build
        run: npm run build
        working-directory: cockpit-ui

      # Drift check: the build output committed under cockpit/static must match
      # what the source produces. Byte-identical rebuilds hold because
      # .gitattributes disables EOL normalization on static/** and npm ci pins
      # exact dep versions. If this ever flakes on cross-OS hash
      # nondeterminism, downgrade to build-succeeds and file the flake -- do
      # not delete the job.
      #   - git diff catches modified/deleted files
      #   - git status catches brand-new untracked assets (e.g. a renamed
      #     hash: diff sees the deletion, status sees the addition)
      - name: committed static matches source
        run: |
          git diff --exit-code -- src/swing_screener/cockpit/static
          test -z "$(git status --porcelain -- src/swing_screener/cockpit/static)"

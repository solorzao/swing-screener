name: Reflection (update edge files)

# Event-triggered reflection, run weekly. For each play type whose live forward shadow book
# has grown by a meaningful batch of new closed trades, it grades the book against a haircut
# 1d replay screen and rewrites edge/<play_type>.md (an Opus seam authors the prose; code
# owns every tier + number). On a "needs a test" hunch the seam may also queue validated
# candidate screen variants into edge/<play_type>.proposed.json (the LLM only proposes;
# to_config gates + promotion stays human-gated). When an edge/ file actually changed, it opens
# a PR for a human to review + merge -- nothing here is auto-merged. See pipeline/reflect.py.
# Note: PRs opened by GITHUB_TOKEN don't auto-trigger CI; push or reopen to run it.
#
# DATABASE: reflection grades the PRODUCTION forward book in Azure SQL. Without SWING_DB_URL
# it would fall back to an empty runner-local sqlite and silently no-op with a green check
# forever -- which is exactly what happened until 2026-07-01 (audit). The job therefore
# FAILS LOUDLY when the connection can't be configured, and connects via azure/login OIDC
# (same federated deploy identity as cd.yml -- no stored secret) + an EPHEMERAL SQL
# firewall rule for this runner's egress IP (reaped + deleted `if: always()`). NOTE on
# auth: db/session.get_engine STRIPS any Authentication= keyword from an mssql URL and
# injects an Entra token itself via DefaultAzureCredential -- which picks up the az login.
#
# One-time setup this workflow needs (beyond cd.yml's):
#   - repo variable AZURE_SQL_SERVER: the SQL server SHORT name (e.g. swing-sql-xxxxx).
#   - the deploy identity needs firewall-rule write on the server (e.g. "SQL Server
#     Contributor" scoped to the server resource) AND a contained read-only DB user --
#     see section 3 of infra/post-deploy.sql (the canonical grants; not repeated here).
#   - repo secret ANTHROPIC_API_KEY (optional: without it the deterministic template
#     authors the prose; verdicts/tiers are code-owned either way).

on:
  schedule:
    - cron: "0 7 * * 0"        # Sundays 07:00 UTC (after the optimizer's 06:00)
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers for the replay screen"
        required: false
        default: "AMD,NVDA,AAPL,MSFT,META,AMZN,GOOGL,TSLA,JPM,XOM,WMT,AVGO"

permissions:
  contents: write
  pull-requests: write
  id-token: write   # required for azure/login OIDC token exchange

jobs:
  reflect:
    runs-on: ubuntu-latest
    env:
      TICKERS: ${{ github.event.inputs.tickers || 'AMD,NVDA,AAPL,MSFT,META,AMZN,GOOGL,TSLA,JPM,XOM,WMT,AVGO' }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      SQL_SERVER: ${{ vars.AZURE_SQL_SERVER }}
      FIREWALL_RULE: gh-reflect-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guard - production DB config must be present (never silently no-op)
        run: |
          if [ -z "$SQL_SERVER" ] || [ -z "$RESOURCE_GROUP" ]; then
            echo "::error::AZURE_SQL_SERVER / AZURE_RESOURCE_GROUP repo variables are not set."
            echo "::error::Reflection must grade the PRODUCTION forward book; refusing to run against an empty local sqlite."
            exit 1
          fi

      # Fast, failure-prone steps FIRST (login + firewall need only az): a mis-granted
      # role or bad secret aborts in seconds instead of after minutes of installs.
      - name: Azure login (OIDC, no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Open ephemeral SQL firewall rule for this runner
        # GitHub-hosted runner IPs are dynamic; a one-run rule (deleted below, even on
        # failure) keeps the server's standing surface at what it was. The reap pass
        # first removes any gh-reflect-* rule stranded by a run the always() delete
        # never saw (lost runner, hard cancellation) -- without it a stranded rule
        # whitelists a pooled GitHub IP indefinitely.
        run: |
          for stale in $(az sql server firewall-rule list \
              --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER" \
              --query "[?starts_with(name, 'gh-reflect-')].name" -o tsv); do
            echo "Reaping stale firewall rule: $stale"
            az sql server firewall-rule delete \
              --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER" --name "$stale"
          done
          RUNNER_IP=$(curl -fsS https://api.ipify.org)
          az sql server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER" \
            --name "$FIREWALL_RULE" \
            --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,azure]"

      - name: Install Microsoft ODBC Driver 18
        run: |
          # --batch/--yes: gpg otherwise tries to prompt on /dev/tty, which the
          # hosted runner doesn't have (exit 2 on the first live run).
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Run reflection against the production forward book
        env:
          # No auth keyword: db/session.get_engine strips it and injects an Entra token
          # via DefaultAzureCredential. AZURE_TOKEN_CREDENTIALS=dev pins that chain to
          # the dev credentials (az login) -- GitHub-hosted runners are Azure VMs with
          # a reachable IMDS endpoint, so the managed-identity probe can otherwise
          # stall or fail the chain before it reaches the CLI credential.
          SWING_DB_URL: mssql+pyodbc://${{ env.SQL_SERVER }}.database.windows.net/swing?driver=ODBC+Driver+18+for+SQL+Server
          AZURE_TOKEN_CREDENTIALS: dev
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m swing_screener.pipeline.reflect --tickers "$TICKERS"

      - name: Remove ephemeral SQL firewall rule
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER" \
            --name "$FIREWALL_RULE" || true

      - name: Detect edge-file changes
        id: changed
        run: |
          if [ -n "$(git status --porcelain edge/)" ]; then
            echo "made=true" >> "$GITHUB_OUTPUT"
          else
            echo "made=false" >> "$GITHUB_OUTPUT"
            echo "No edge file changed; nothing to PR."
          fi

      - name: Open reflection PR
        if: steps.changed.outputs.made == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: reflection/edge-update
          base: main
          title: "reflection: update edge playbooks from the forward book"
          body: |
            Auto-generated by the event-triggered reflection pass (`pipeline.reflect`).
            **Review before merging** — nothing here is auto-merged.

            For each play type whose live forward shadow book has advanced by a batch of new
            closed trades, the deterministic grader re-tiered every pre-registered condition
            (forward-confirmed / replay-screened / hunch) and an Opus seam re-authored the
            prose. On a "needs a test" hunch the seam may also QUEUE candidate screen variants
            into `edge/<play_type>.proposed.json` — a `StrategyConfig` delta + rationale the
            optimizer will sweep. **The LLM only proposes**: code validates every delta and
            promotion stays human-gated. Review the queued candidates here.
            Code owns every tier and number; the LLM only writes the narrative + proposes tests.
          commit-message: "reflection: update edge playbooks from the forward book"
          # edge/ covers the playbooks (edge/*.md), the queued candidate variants
          # (edge/*.proposed.json), AND the verdicts sidecars (edge/*.verdicts.json --
          # committed since 2026-07: the runtime + Docker image read them).
          add-paths: |
            edge/*.md
            edge/*.proposed.json
            edge/*.verdicts.json
          labels: reflection
          delete-branch: true

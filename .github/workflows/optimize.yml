name: Optimizer (propose config)

# Scheduled half of the build -> measure -> optimize -> repeat loop. Weekly, it runs the
# walk-forward optimizer over a basket of liquid names and -- only when a swept config beats
# the shipped gate on a trusted, out-of-sample basis -- opens a PR editing config.py. A human
# still reviews + merges; nothing auto-deploys. See pipeline/propose.py for the (conservative)
# decision rules. Note: PRs opened by GITHUB_TOKEN don't auto-trigger CI; push or reopen to run it.

on:
  schedule:
    - cron: "0 6 * * 0"        # Sundays 06:00 UTC
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers to sweep (overrides the universe-seed basket)"
        required: false
        default: ""
      basket_size:
        description: "How many universe-seed tickers to sweep when no explicit list is given"
        required: false
        default: "100"

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    env:
      TICKERS_OVERRIDE: ${{ github.event.inputs.tickers || '' }}
      BASKET_SIZE: ${{ github.event.inputs.basket_size || '100' }}
      # Last-resort basket if runtime derivation from the universe seed fails. The seed
      # basket is the default: a fixed mega-cap dozen is exactly the "bounded baskets
      # flatter" failure mode (edge-discovery backlog / 2026-07-01 audit).
      FALLBACK_TICKERS: "AMD,NVDA,AAPL,MSFT,META,AMZN,GOOGL,TSLA,JPM,XOM,WMT,AVGO"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Resolve ticker basket (explicit input, else first N of the universe seed)
        id: basket
        run: |
          if [ -n "$TICKERS_OVERRIDE" ]; then
            TICKERS="$TICKERS_OVERRIDE"
          else
            TICKERS=$(python -m swing_screener.data.universe --first "$BASKET_SIZE") || TICKERS="$FALLBACK_TICKERS"
          fi
          echo "Sweeping $(echo "$TICKERS" | awk -F',' '{print NF}') tickers"
          echo "tickers=$TICKERS" >> "$GITHUB_OUTPUT"

      - name: Run optimizer (may edit config.py + write pr_title.txt / pr_body.md)
        run: python -m swing_screener.pipeline.propose --tickers "${{ steps.basket.outputs.tickers }}"

      - name: Read proposal (if any)
        id: proposal
        run: |
          if [ -f pr_title.txt ]; then
            echo "made=true" >> "$GITHUB_OUTPUT"
            echo "title=$(cat pr_title.txt)" >> "$GITHUB_OUTPUT"
            {
              echo 'body<<PR_BODY_EOF'
              cat pr_body.md
              echo PR_BODY_EOF
            } >> "$GITHUB_OUTPUT"
          else
            echo "made=false" >> "$GITHUB_OUTPUT"
            echo "No config change proposed."
          fi

      - name: Open proposal PR
        if: steps.proposal.outputs.made == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: optimizer/config-proposal
          base: main
          title: ${{ steps.proposal.outputs.title }}
          body: ${{ steps.proposal.outputs.body }}
          commit-message: ${{ steps.proposal.outputs.title }}
          add-paths: src/swing_screener/config.py
          labels: optimizer
          delete-branch: true

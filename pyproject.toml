[project]
name = "swing-screener"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "mplfinance>=0.12.10b0",  # mplfinance only ever ships pre-releases; pin one so pip accepts it
    "yfinance>=0.2",
    "pyarrow>=15",
    "anthropic>=0.51",  # >=0.51 for the server-side web_search tool (deep analysis)
    "reportlab>=4.0",
]

[project.optional-dependencies]
# ruff is capped to a minor: CI installs it fresh from this extra every run, so an
# open-ended floor lets a new ruff release (new stable rules) break every PR's lint
# gate at once. Bump the cap deliberately, after `ruff check src tests alembic`
# passes locally on the new version.
dev = ["pytest>=8", "ruff>=0.15,<0.16", "mypy>=1.11", "pandas-stubs"]
cockpit = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pywebview>=6.2",  # >=6.2 for winforms start(icon=...); older raises/ignores it (see cockpit __main__)
    "sse-starlette>=2.1",  # /api/events wake channel (EventSourceResponse)
]
azure = [
    "pyodbc>=5.1",
    "azure-identity>=1.17",
    "azure-keyvault-secrets>=4.8",
    "azure-storage-blob>=12.20",
    "azure-communication-email>=1.0",
    "alembic>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
swing_screener = ["py.typed"]
# The screening universe ships INSIDE the package: load_universe() resolves it
# via Path(__file__).parent, so a non-editable `pip install` (the Docker image)
# must bundle the CSV or DEFAULT_SEED won't exist at runtime.
"swing_screener.data" = ["universe_seed.csv"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

# These test files import mid-file on purpose: each test section carries its own
# imports (see the inline comments there). E402 is a layout choice, not a
# correctness issue, so it is ignored for exactly these files -- a stray late
# import anywhere else still gets flagged.
[tool.ruff.lint.per-file-ignores]
"tests/db/test_session_mssql.py" = ["E402"]
"tests/pipeline/test_reflect_verdicts_json.py" = ["E402"]

# FastAPI's design puts callables (Depends/Query/...) in argument defaults, which
# is exactly what flake8-bugbear's B008 flags. This allowlist is ruff's documented
# mechanism for it, so B008 still catches genuine mutable-default calls elsewhere.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Cookie",
]

[tool.mypy]
python_version = "3.12"
# The CI gate is `mypy` (bare), which type-checks ONLY the installed package via
# ``packages`` -- tests are runtime-checked by pytest, not type-checked. The test
# files are nonetheless kept mypy-clean so `mypy tests` / `mypy .` (which a dev may
# run) stays quiet. ``exclude`` drops the stale ``build/lib/swing_screener`` copy
# (a gitignored build artifact) so `mypy .` doesn't hit a duplicate-module error.
packages = ["swing_screener"]
exclude = ['^build/']
ignore_missing_imports = true

# The repo's top-level alembic/ migrations dir shadows the `alembic` PyPI package
# for mypy's import resolution (it is not installed in CI -- it's in the optional
# `azure` extra). At runtime the installed package wins (it has __init__.py); for
# mypy, skip-following the import so `from alembic import command` is treated as
# Any rather than resolving to the local migrations dir (which lacks `command`).
[[tool.mypy.overrides]]
module = ["alembic.*", "alembic"]
follow_imports = "skip"
ignore_missing_imports = true
